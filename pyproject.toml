[project]
name = "lkml-blastradius"
version = "0.2.0"
description = "The blast radius of every Looker change: which dashboards, Looks, explores and Conversational Analytics agents a LookML deploy or Google release affects, reported daily."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Venkata Sangaraju" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License",
  "Topic :: Database",
]
dependencies = ["httpx>=0.27", "pyyaml>=6.0"]

[project.scripts]
lkblast = "lkml_blastradius.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10", "types-PyYAML>=6.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lkml_blastradius"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
strict = true
files = ["src/lkml_blastradius"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
