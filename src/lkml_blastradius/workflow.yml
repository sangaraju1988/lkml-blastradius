# Daily LookML blast radius report (written by `lkblast init`).
# Repo secrets: LOOKER_BASE_URL, LOOKER_CLIENT_ID, LOOKER_CLIENT_SECRET, SLACK_WEBHOOK_URL (optional).
# Snapshot history is kept in the Actions cache; it is refreshed every run, so it does not expire.
name: lkml-blastradius

on:
  schedule:
    - cron: "0 6 * * *" # 06:00 UTC daily
  workflow_dispatch: {}

concurrency: lkml-blastradius

jobs:
  impact:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install lkml-blastradius
      - name: Restore snapshot history
        uses: actions/cache/restore@v4
        with:
          path: .lkblast
          key: lkblast-${{ github.run_id }}
          restore-keys: lkblast-
      - name: Run
        env:
          LOOKER_BASE_URL: ${{ secrets.LOOKER_BASE_URL }}
          LOOKER_CLIENT_ID: ${{ secrets.LOOKER_CLIENT_ID }}
          LOOKER_CLIENT_SECRET: ${{ secrets.LOOKER_CLIENT_SECRET }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: lkblast run
      - name: Save snapshot history
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .lkblast
          key: lkblast-${{ github.run_id }}
      - name: Job summary
        if: always()
        run: test -f reports/blastradius.md && cat reports/blastradius.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lkml-blastradius-report
          path: reports/
          retention-days: 30
